version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_pass
      POSTGRES_DB: inventory_sync
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_sync"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload
    ports:
      - "8003:8003"
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://inventory:inventory_pass@postgres:5432/inventory_sync
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - screenshots_data:/app/screenshots
      - supplier_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://inventory:inventory_pass@postgres:5432/inventory_sync
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - screenshots_data:/app/screenshots
      - supplier_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A app.tasks.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://inventory:inventory_pass@postgres:5432/inventory_sync
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - redis

  flower:
    build: .
    command: celery -A app.tasks.celery_app flower --port=5555 --broker=redis://redis:6379/0
    ports:
      - "5556:5555"
    env_file: .env.example
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
  screenshots_data:
  supplier_data:
